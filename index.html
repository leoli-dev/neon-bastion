<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Neon Bastion — 4v4 Arena FPS</title>
    <!--
      UI-03: favicon, all inline (zero external assets, survives `vite build`
      untouched). A 4-tick crosshair in blue-team 0x18e0ff with a red-team
      0xff3d63 core on the dark app background — simple enough to read at 16px.
    -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230a0b0e'/%3E%3Cg stroke='%2318e0ff' stroke-width='3' stroke-linecap='round'%3E%3Cpath d='M16 5v6M16 21v6M5 16h6M21 16h6'/%3E%3C/g%3E%3Ccircle cx='16' cy='16' r='3.5' fill='%23ff3d63'/%3E%3C/svg%3E" />
    <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230a0b0e'/%3E%3Cg stroke='%2318e0ff' stroke-width='3' stroke-linecap='round'%3E%3Cpath d='M16 5v6M16 21v6M5 16h6M21 16h6'/%3E%3C/g%3E%3Ccircle cx='16' cy='16' r='3.5' fill='%23ff3d63'/%3E%3C/svg%3E" />
    <meta name="theme-color" content="#0a0b0e" />
    <style>
      html, body { margin: 0; padding: 0; height: 100%; background: #0a0b0e; overflow: hidden; }
      #app { position: fixed; inset: 0; }
      #webgl-canvas { display: block; width: 100%; height: 100%; }
      * { box-sizing: border-box; }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="webgl-canvas"></canvas>
      <!-- HUD / overlays are mounted into #app by the UI layer -->
    </div>
    <noscript>
      <div style="color:#e6e8ee;font-family:system-ui;padding:24px">
        Neon Bastion requires JavaScript. Enable JavaScript to play.
      </div>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
